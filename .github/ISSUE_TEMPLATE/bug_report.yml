name: Bug report
description: Report a reproducible problem with Kaskade
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues first, and remove passwords, tokens, certificates, and private broker addresses from everything you paste.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - admin
        - consumer
        - producer
        - Not mode-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kaskade version
      description: The output of `kaskade --version`.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: The command you ran, what you saw, and what you expected.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, installation method, Python version, and Kafka distribution.
      placeholder: "macOS 15.6, Homebrew, Python 3.13, Apache Kafka 4.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
