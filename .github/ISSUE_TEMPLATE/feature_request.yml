name: Feature request
description: Propose an improvement to Kaskade
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Search existing issues and discussions first. Describe the problem so other solutions stay open.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - admin
        - consumer
        - producer
        - Not mode-specific
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How Kaskade should behave, from a user's point of view.
    validations:
      required: true
