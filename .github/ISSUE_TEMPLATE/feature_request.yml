name: Feature request
description: Propose an improvement to Kaskade
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement. Focus on the problem and desired behavior so alternatives remain open.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how Kaskade should behave from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, related tools, or links that help explain the request.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
