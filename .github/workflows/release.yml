name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.10"

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.10"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Analyze
        run: uv run --locked python -m scripts.analyze
      - name: Run unit tests
        run: uv run --locked python -m scripts.tests
      - name: Build distributions
        run: uv build --clear
      - name: Verify distributions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          uv run --locked python -m scripts.verify_release dist
          --expected-version "$RELEASE_VERSION"
      - name: Install and verify wheel
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv venv "$RUNNER_TEMP/release-venv" --python 3.10
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/kaskade" --version | grep -F "$RELEASE_VERSION"
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4.9.0
        with:
          version: v2.14.1
          config: cliff.toml
          args: --current --strip header --output release-notes.md
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bundle
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  attest-packages:
    name: Attest packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-bundle
      - name: Attest distributions
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [build, attest-packages]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/kaskade/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-bundle
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/

  publish-docker:
    name: Publish to Docker Hub
    needs: [build, attest-packages]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://hub.docker.com/r/sauljabin/kaskade/tags
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download release bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-bundle
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: docker.io/sauljabin/kaskade
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest image
        uses: actions/attest@v4.2.2
        with:
          subject-name: index.docker.io/sauljabin/kaskade
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Publish GitHub release
    needs: [build, publish-pypi, publish-docker]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download release bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-bundle
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --title "$RELEASE_TAG"
          --notes-file release-notes.md
          --verify-tag
          --fail-on-no-commits
