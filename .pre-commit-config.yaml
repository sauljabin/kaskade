fail_fast: true
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: styles
        name: applying styles
        language: system
        always_run: true
        pass_filenames: false
        entry: uv run --locked python -m scripts.styles
      - id: screenshots
        name: generating screenshots
        language: system
        pass_filenames: false
        files: ^(kaskade/|scripts/(__init__|screenshots)\.py$|pyproject\.toml$|uv\.lock$)
        entry: uv run --locked python -m scripts.screenshots
      - id: analyze
        name: code analysis
        language: system
        always_run: true
        pass_filenames: false
        entry: uv run --locked python -m scripts.analyze
      - id: tests
        name: running tests
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: uv run --locked python -m scripts.tests
      - id: tests-e2e
        name: running e2e tests
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        entry: uv run --locked python -m scripts.tests --e2e
