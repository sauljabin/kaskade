# Kafka and Schema Registry properties are passed to confluent-kafka.
# Inline --kafka, --registry, and --aws properties override matching file entries.
# An explicit -b/--bootstrap-servers value overrides bootstrap.servers.

[kafka]
bootstrap.servers = my-msk-bootstrap:9098
client.id = kaskade

[registry]
provider = confluent
url = https://my-schema-registry:8081
basic.auth.user.info = replace-with-your-api-key:replace-with-your-api-secret

[aws]
region = us-east-1

# Kaskade operation timeouts are expressed in seconds.
[timeouts]
consumer.poll = 0.5
consumer.idle = 2.5
consumer.assignment = 15
consumer.request = 10
admin.read = 10
admin.write = 60
