# Kafka client properties passed to confluent-kafka.
# bootstrap.servers may instead come from -b/--bootstrap-servers or --config.
# An explicit -b/--bootstrap-servers value overrides this file.
# Amazon MSK IAM authentication is configured separately with --aws region=<region>.

bootstrap.servers=my-kafka:9092
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.username=replace-with-your-api-key
sasl.password=replace-with-your-api-secret
client.id=kaskade
