# Copy this file to ~/.config/kaskade/settings.yaml on Linux or macOS.

# Use any theme from the in-application Commands window, or a custom theme below.
theme: eva01-berserk

# Custom themes. Only primary is required; quote hex colors.
themes:
  solarized-kaskade:
    primary: "#268BD2"
    secondary: "#2AA198"
    warning: "#B58900"
    error: "#DC322F"
    success: "#859900"
    accent: "#6C71C4"
    foreground: "#839496"
    background: "#002B36"
    surface: "#073642"
    panel: "#002B36"
    boost: "#0A4050"
    dark: true

# Set refresh-interval to 0 to disable auto-refresh; enabled intervals must be at
# least 5 seconds. Timeouts are Kaskade operation deadlines in seconds;
# --timeout admin.read=20 overrides admin.timeouts.read for one session.
admin:
  refresh-interval: 30
  timeouts:
    read: 10
    write: 60

consumer:
  timeouts:
    poll: 0.5
    idle: 2.5
    assignment: 15
    request: 10

# Values are Textual key names; use commas to assign multiple keys.
keymap:
  # Application
  app.quit: ctrl+c
  app.command-palette: colon,ctrl+p
  help.toggle: question_mark,f1
  kaskade.help.close: escape,q

  # Navigation
  kaskade.navigation.select: enter
  kaskade.navigation.up: up,k
  kaskade.navigation.down: down,j
  kaskade.navigation.left: left,h
  kaskade.navigation.right: right,l
  kaskade.navigation.page-up: pageup
  kaskade.navigation.page-down: pagedown
  kaskade.navigation.page-left: ctrl+pageup
  kaskade.navigation.page-right: ctrl+pagedown
  kaskade.navigation.first: ctrl+home,g
  kaskade.navigation.last: ctrl+end,G
  kaskade.navigation.home: home
  kaskade.navigation.end: end

  # Topics
  kaskade.topics.describe: d,enter
  kaskade.topics.copy: y
  kaskade.topics.filter: slash,ctrl+f
  kaskade.topics.refresh: ctrl+r
  kaskade.topics.create: n,ctrl+n
  kaskade.topics.edit: e,ctrl+e
  kaskade.topics.delete: ctrl+d
  kaskade.topics.show-all: escape

  # Records
  kaskade.records.show: enter
  kaskade.records.copy: y
  kaskade.records.export: ctrl+e
  kaskade.records.consume: n
  kaskade.records.filter: slash,ctrl+f
  kaskade.records.chunk-size: "#"
  kaskade.records.show-all: escape

  # Dialogs and editors
  kaskade.filter-topics.apply: enter
  kaskade.filter-topics.close: escape
  kaskade.delete-topic.confirm: enter
  kaskade.delete-topic.cancel: escape
  kaskade.describe-topic.close: escape
  kaskade.edit-topic.close: escape
  kaskade.edit-topic.save: ctrl+s,ctrl+shift+s,f2
  kaskade.create-topic.close: escape
  kaskade.create-topic.save: ctrl+s,ctrl+shift+s,f2
  kaskade.filter-records.apply: enter
  kaskade.filter-records.close: escape
  kaskade.chunk-size.select: enter
  kaskade.chunk-size.close: escape
  kaskade.record-details.previous: N,p
  kaskade.record-details.next: n
  kaskade.record-details.close: escape
