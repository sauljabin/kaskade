services:
  kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "10"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: >-
        CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    ports:
      - "9092:19092"

  apicurio-topics:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for topic in _apicurio-registry-journal _apicurio-registry-snapshots; do
          kafka-topics --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 \
            --replication-factor 1 --config cleanup.policy=delete \
            --config retention.ms=-1 --config retention.bytes=-1
          kafka-configs --bootstrap-server kafka:9092 \
            --alter --entity-type topics --entity-name "$$topic" \
            --add-config cleanup.policy=delete,retention.ms=-1,retention.bytes=-1
        done

  apicurio:
    image: apicurio/apicurio-registry:${APICURIO_VERSION}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-topics:
        condition: service_completed_successfully
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
      APICURIO_KAFKASQL_TOPIC: _apicurio-registry-journal
      APICURIO_KAFKASQL_SNAPSHOTS_TOPIC: _apicurio-registry-snapshots
      QUARKUS_HTTP_PORT: "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent
          http://localhost:8080/apis/registry/v3/system/info >/dev/null
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "8082:8080"

  schema-registry:
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "1"
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
            "http://localhost:8081/subjects", timeout=5
          ).close()
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "8081:8081"

networks:
  default:
    name: sandbox
